<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            /* lagura */
            width: 500px;
            /* Altura */
            height: 400px;
            /* Para unir as linhas entre as celulas */
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            /* Alinhamento horizontal 
                - center - centro
                - left - esquerda
                - right - direita
            */
            text-align: center;
            /* Alinhamento vertical
                - top 
                - bottom 
                - middle 
            */
            vertical-align: middle;
        }

        .numero {
            text-align: right;
        }



    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    
    <table>
        <tr> 
            <td class="left">A1</td>
            <td class="center">B1</td>
            <td class="right">C1</td>
        </tr> 
        <tr class="linha">
            <td class="top">A2</td>
            <td class="center">B2</td>
            <td class="bottom">C2</td>
        </tr>
        <tr> 
            <td class="top">A3</td>
            <td class="bottom">B3</td>
            <td class="center">C3</td>
        </tr>
        <tr> 
            <td>A4</td>
            <td class="right">B4</td>
            <td>C4</td>
        </tr>

    </table>
    
</body>
</html>
